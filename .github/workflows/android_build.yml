name: Generate Production APK Automatically

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. تحميل الكود من المستودع
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. تثبيت بيئة Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # 3. خطوة ذكية للبحث عن مجلد الأندرويد الفعلي والدخول إليه تلقائياً لبناء التطبيق
      - name: Locate Project and Build APK
        run: |
          # البحث عن المجلد الذي يحتوي على ملف الإعدادات أو مجلد src
          TARGET_DIR=$(find . -name "build.gradle" -not -path "*/build/*" | head -n 1 | xargs dirname)
          echo "تم العثور على مشروع أندرويد في المسار: $TARGET_DIR"
          
          cd "$TARGET_DIR"
          
          # توليد الـ wrapper محلياً بالسيرفر إذا كان مفقوداً
          gradle wrapper
          
          # إعطاء صلاحيات التشغيل
          chmod +x gradlew
          
          # تجميع التطبيق بنمط الـ Debug
          ./gradlew assembleDebug
          
          # نقل ملف الـ APK الناتج إلى المجلد الرئيسي لتسهيل رفعه
          mkdir -p $GITHUB_WORKSPACE/output_apk
          find . -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/output_apk/ \;

      # 4. رفع ملف الـ APK الناتج مباشرة لتتمكن من تحميله من صفحة الـ Actions
      - name: Upload Generated APK
        uses: actions/upload-artifact@v4
        with:
          name: yemen-telecom-app
          path: output_apk/
