name: Generate Production APK Automatically

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. تحميل الكود من المستودع
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. تثبيت بيئة Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # 3. إنشاء ملفات الـ Wrapper وتحديد مسار العمل الصحيح
      - name: Ensure Gradle Wrapper exists
        run: gradle wrapper
        working-directory: ./mediator-

      # 4. إعطاء صلاحية التشغيل لملف gradlew داخل المجلد الصحيح
      - name: Grant execute permission
        run: chmod +x gradlew
        working-directory: ./mediator-

      # 5. بناء التطبيق وتصدير ملف الـ APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug
        working-directory: ./mediator-

      # 6. رفع ملف الـ APK الناتج كنسخة جاهزة للتحميل
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: mediator-/app/build/outputs/apk/debug/app-debug.apk
