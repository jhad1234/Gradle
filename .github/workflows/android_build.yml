name: Generate Production APK Automatically

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. تحميل الكود من المستودع
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. تثبيت بيئة Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # 🛠️ 3. الخطوة الإنقاذية لضمان عدم فشل البناء (توليد الـ gradlew تلقائياً)
      - name: Ensure Gradle Wrapper exists
        run: gradle wrapper

      # 4. إعطاء صلاحية التشغيل للملف المولد
      - name: Grant execute permission
        run: chmod +x gradlew

      # 5. فك تشفير الـ Keystore بأمان من إعدادات الحساب
      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      # 6. بناء ملف الـ APK بنمط الـ Release
      - name: Build Release APK
        run: ./gradlew assembleRelease

      # 7. توقيع التطبيق رسمياً لحمايته من التعديل والمحاكاة
      - name: Sign APK
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks release.keystore \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            --ks-pass pass:"${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --out app-release-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      # 8. التحقق التقني من صحة التوقيع الرقمي
      - name: Verify APK Signature
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify app-release-signed.apk

      # 9. توليد رابط تحميل مباشر للنسخة المحدثة النهائية في أسفل المستودع
      - name: Create GitHub Release
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: latest-production-v1.0
          prerelease: false
          title: "📥 تحميل النسخة النهائية للتطبيق"
          files: |
            app-release-signed.apk
